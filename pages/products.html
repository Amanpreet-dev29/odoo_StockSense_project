<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockSense - Products</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="app-container">
        <!-- Shared Sidebar -->
        <aside class="sidebar">
            <div class="brand">📦 StockSense</div>
            <ul class="nav-list">
                <li class="nav-item"><a href="../index.html" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="products.html" class="nav-link active">Products</a></li>
                <li class="nav-item"><a href="receipts.html" class="nav-link">Receipts</a></li>
                <li class="nav-item"><a href="deliveries.html" class="nav-link">Delivery Orders</a></li>
                <li class="nav-item"><a href="transfers.html" class="nav-link">Internal Transfers</a></li>
                <li class="nav-item"><a href="adjustments.html" class="nav-link">Adjustments</a></li>
                <li class="nav-item"><a href="move-history.html" class="nav-link">Move History</a></li>
                <li class="nav-item"><a href="settings.html" class="nav-link">Settings</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Product Catalog</h2>
                <button class="btn-primary" onclick="openModal('add-product-modal')">+ Add Product</button>
            </div>

            <!-- Search and Filter Bar -->
            <div class="filters-bar" style="grid-template-columns: 2fr 1fr 1fr;">
                <input type="text" id="search-sku" placeholder="Search by Product Name or SKU..." onkeyup="filterProducts()" style="padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <select id="filter-cat" onchange="filterProducts()">
                    <option value="ALL">All Categories</option>
                    <option value="Raw Materials">Raw Materials</option>
                    <option value="Finished Goods">Finished Goods</option>
                </select>
            </div>

            <!-- Products Table -->
            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>SKU / Code</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Unit of Measure</th>
                            <th>Total Stock</th>
                            <th>Warehouse Location</th>
                            <th>Reorder Threshold</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <!-- Populated by products.js -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Add Product Modal -->
    <div id="add-product-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Create New Product</h3>
            <form id="create-product-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                <input type="text" id="prod-name" placeholder="Product Name (e.g., Steel Rods)" required>
                <input type="text" id="prod-sku" placeholder="SKU Code (e.g., SKU1R005)" required>
                <select id="prod-category">
                    <option value="Raw Materials">Raw Materials</option>
                    <option value="Finished Goods">Finished Goods</option>
                </select>
                <input type="text" id="prod-unit" placeholder="Unit of Measure (e.g., kg, Unit, Box)" required>
                <input type="number" id="prod-initial" placeholder="Initial Stock Quantity (Optional)" value="0">
                <input type="text" id="prod-location" placeholder="Warehouse Location (e.g., Main/Rack A)" required>
                <input type="number" id="prod-threshold" placeholder="Low Stock Threshold Alert" value="10">
                
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                    <button type="button" class="btn-secondary" onclick="closeModal('add-product-modal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase.js"></script>
    <script src="../js/pages/products.js"></script>
</body>
</html>
