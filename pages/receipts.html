<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockSense - Incoming Receipts</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">📦 StockSense</div>
            <ul class="nav-list">
                <li class="nav-item"><a href="../index.html" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="products.html" class="nav-link">Products</a></li>
                <li class="nav-item"><a href="receipts.html" class="nav-link active">Receipts</a></li>
                <li class="nav-item"><a href="deliveries.html" class="nav-link">Delivery Orders</a></li>
                <li class="nav-item"><a href="transfers.html" class="nav-link">Internal Transfers</a></li>
                <li class="nav-item"><a href="adjustments.html" class="nav-link">Adjustments</a></li>
                <li class="nav-item"><a href="move-history.html" class="nav-link">Move History</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Incoming Goods Receipts</h2>
                <button class="btn-primary" onclick="openModal('receipt-modal')">+ Create Receipt</button>
            </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Reference</th>
                            <th>Supplier / Vendor</th>
                            <th>Target Location</th>
                            <th>Status</th>
                            <th>Created Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="receipts-table-body">
                        <!-- Dynamic Receipts Rows -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Create Receipt Modal -->
    <div id="receipt-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>New Stock Receipt</h3>
            <form id="create-receipt-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                <input type="text" id="rec-supplier" placeholder="Vendor / Supplier Name" required>
                <select id="rec-product" required>
                    <!-- Dynamically populated with options -->
                </select>
                <input type="number" id="rec-qty" placeholder="Quantity Received" required>
                <input type="text" id="rec-location" placeholder="Destination (e.g., Main Store/Rack A)" required>

                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                    <button type="button" class="btn-secondary" onclick="closeModal('receipt-modal')">Cancel</button>
                    <button type="submit" class="btn-primary">Process Receipt</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase.js"></script>
    <script src="../js/services/operations.service.js"></script>
    <script src="../js/pages/receipts.js"></script>
</body>
</html>
