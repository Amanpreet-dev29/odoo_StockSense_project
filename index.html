<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Makes the layout fit phones, tablets, and computers -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StockSense | Inventory Dashboard</title>

  <!-- Use a readable font for the dashboard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Shared styles for the entire StockSense app -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="dashboard">
  <!-- JavaScript will render the sidebar, top bar, and dashboard here -->
  <div id="app"></div>

  <!-- type="module" lets the app use separate JavaScript files -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
